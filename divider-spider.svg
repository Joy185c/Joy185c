<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA" stop-opacity=".7"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
<style>.leg{transform-box:fill-box;transform-origin:50% 0;animation:leg .5s ease-in-out infinite alternate}
.l2{animation-delay:-.25s}@keyframes leg{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:tl 1.4s ease-in-out infinite alternate}
@keyframes tl{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.bob{animation:bob .5s ease-in-out infinite alternate}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.legs{transform-box:fill-box;transform-origin:50% 50%;animation:lg .35s ease-in-out infinite alternate}
@keyframes lg{from{transform:scale(1,1)}to{transform:scale(1.1,.92)}}
.sp{animation:sp 9s ease-in-out infinite alternate}
@keyframes sp{0%{transform:translate(90px,16px)}25%{transform:translate(380px,58px)}50%{transform:translate(640px,22px)}75%{transform:translate(900px,62px)}100%{transform:translate(1110px,18px)}}
</style></defs>
<rect x="0" y="44" width="1200" height="2" fill="url(#g)"/>
<g class="sp"><line x1="0" y1="-300" x2="0" y2="-4" stroke="#CBD5E1" stroke-opacity=".5" stroke-width="1"/><g class="legs"><polyline points="0,0 -10,-6 -18,-16" fill="none" stroke="#38BDF8" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,0 -12,-1 -22,-4" fill="none" stroke="#38BDF8" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,0 -12,3 -22,8" fill="none" stroke="#38BDF8" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,0 -10,7 -17,18" fill="none" stroke="#38BDF8" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,0 10,-6 18,-16" fill="none" stroke="#38BDF8" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,0 12,-1 22,-4" fill="none" stroke="#38BDF8" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,0 12,3 22,8" fill="none" stroke="#38BDF8" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,0 10,7 17,18" fill="none" stroke="#38BDF8" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<ellipse cx="0" cy="6" rx="7" ry="8.5" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".8"/>
<circle cx="0" cy="-5" r="5" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".8"/>
<circle cx="-2" cy="-6" r="1.1" fill="#F43F5E"/><circle cx="2" cy="-6" r="1.1" fill="#F43F5E"/></g>
</svg>