<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".7"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
<style>.leg{transform-box:fill-box;transform-origin:50% 0;animation:leg .5s ease-in-out infinite alternate}
.l2{animation-delay:-.25s}@keyframes leg{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:tl 1.4s ease-in-out infinite alternate}
@keyframes tl{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.bob{animation:bob .5s ease-in-out infinite alternate}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.legs{transform-box:fill-box;transform-origin:50% 50%;animation:lg .35s ease-in-out infinite alternate}
@keyframes lg{from{transform:scale(1,1)}to{transform:scale(1.1,.92)}}
.walk{animation:walk 16s linear infinite}
@keyframes walk{0%{transform:translateX(-60px) scaleX(1)}47%{transform:translateX(1260px) scaleX(1)}50%{transform:translateX(1260px) scaleX(-1)}97%{transform:translateX(-60px) scaleX(-1)}100%{transform:translateX(-60px) scaleX(1)}}
</style></defs>
<rect x="0" y="62" width="1200" height="2" fill="url(#g)"/>
<g class="walk"><g transform="translate(0,62)"><g class="bob">
<path class="tail" d="M-21,-20 Q-42,-22 -36,-46" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
