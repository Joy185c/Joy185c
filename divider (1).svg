<line class="leg l1" x1="20" y1="-10" x2="20" y2="0" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>
<ellipse cx="0" cy="-18" rx="23" ry="11" fill="#1E293B" stroke="#38BDF8" stroke-opacity=".5"/>
<circle cx="27" cy="-28" r="10" fill="#1E293B" stroke="#38BDF8" stroke-opacity=".5"/>
<polygon points="19,-35 21,-47 28,-37" fill="#1E293B" stroke="#38BDF8" stroke-opacity=".5"/>
